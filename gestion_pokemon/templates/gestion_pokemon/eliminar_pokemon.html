{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex - Eliminar Pokémon</title>
    <!-- Enlace al archivo CSS independiente -->
    <link rel="stylesheet" href="{% static 'css/eliminar_pokemon.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="delete-card">
        <h2>⚠️ ¿Estás seguro?</h2>
        <p>Estás a punto de eliminar a <strong>{{ pokemon.nombre }}</strong> de la Pokédex. Esta acción no se puede deshacer.</p>

        <form method="POST">
            {% csrf_token %}
            <div class="delete-buttons">
                <button type="submit" class="btn btn-delete">Sí, eliminar</button>
                <a href="{% url 'gestion_pokemon:lista_pokemones' %}" class="btn btn-back">Cancelar</a>
            </div>
        </form>
    </div>

</body>
</html>
